    <h1>Microsoft Store AI Bot Multiselect (Chrome)</h1>
    <div class="grid">
        <section>
            <h2>Browser Default</h2>
            <div class="multi default">
                <p class="aimsg">And how will you be using your Surface?</p>
                <form action="/">
                    <label class="checkbox">
                        <input type="checkbox" name="test1" value="1">Personal fun
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" name="test1" value="2">Daily productivity
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" name="test1" value="3">Multi-tasking or casual gaming
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" name="test1" value="4">Professional software
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" name="test1" value="5">High-end gaming
                    </label>
                    <input class="continue disabled" type="submit" value="Continue">
                    <button class="back">Back</button>
                </form>
            </div>
        </section>
