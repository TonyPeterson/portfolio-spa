<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AI Bot Multiselect</title>
    <link rel="stylesheet" href="Styles.css">
    <script src="jquery.js"></script>
    <script src="Scripts.js"></script>
</head>

<body>
    <h1>Microsoft Store AI Bot Multiselect (Chrome)</h1>
    <h3>Left aligned</h3>
    <div class="grid">
        <section>
            <h2>Fixed width</h2>
            <div class="multi default">
                <p class="aimsg">And how will you be using your Surface?</p>
                <form action="/">
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="1">Personal fun
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="2">Daily productivity
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="3">Multi-tasking or casual gaming
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="4">Professional software
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="5">High-end gaming
                    </label>
                    <input class="continue disabled" type="submit" value="Continue">
                    <button class="back">Back</button>
                </form>
            </div>
        </section>
        <section>
            <h2>Variable width</h2>
            <div class="multi default variable">
                <p class="aimsg">And how will you be using your Surface?</p>
                <form action="/"> 
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="1">Personal fun
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="2">Daily productivity
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="3">Multi-tasking or casual gaming
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="4">Professional software
                    </label>
                    <label class="checkbox left">
                        <input type="checkbox" name="test1" value="5">High-end gaming
                    </label>
                    <input class="continue disabled" type="submit" value="Continue">
                    <button class="back">Back</button>
                </form>
            </div>
        </section>
        <section>
                <h2>List style</h2>
                <div class="multi default list">
                    <p class="aimsg">And how will you be using your Surface?</p>
                    <form action="/">
                        <label class="checkbox left">
                            <input type="checkbox" name="test1" value="1">Personal fun
                        </label>
                        <label class="checkbox left">
                            <input type="checkbox" name="test1" value="2">Daily productivity
                        </label>
                        <label class="checkbox left">
                            <input type="checkbox" name="test1" value="3">Multi-tasking or casual gaming
                        </label>
                        <label class="checkbox left">
                            <input type="checkbox" name="test1" value="4">Professional software
                        </label>
                        <label class="checkbox left">
                            <input type="checkbox" name="test1" value="5">High-end gaming
                        </label>
                        <input class="continue disabled" type="submit" value="Continue">
                        <button class="back">Back</button>
                    </form>
                </div>
            </section>
    </div>
</body>

</html>
