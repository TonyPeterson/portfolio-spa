<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony-Built Dashboard Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-active-tab="about">

    <!-- BACKGROUND ATMOSPHERE -->
    <div class="bg-layer about-bg"></div>
    <div class="bg-layer portfolio-bg"></div>
    <img class="tonyside" src="images/TonySidewaysBW1.png" alt="">

    <!-- LOGO -->
    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" class="logo-svg" viewBox="0 0 256 179.5">
            <path d="M256 101.9V73.4c0-2.5-.9-4.9-2.7-7 1.1-2.2 1.6-4.4 1.6-6.6V31.5c.1-8.6-7.7-15.3-13.7-19.7C231.1 4.4 221.4.7 210.6.1c-10.9-.6-23.3 2.1-39.2 8.3h-.1L160 13.2h-.1l-2.1.9c-.1 0-.2.1-.2.1l-11.8 5.4c-5.2 2.4-8.4 6.2-8.8 10.5v12.4c-2-.4-4.1-.7-6-.9-13.5-1.3-25.7 1.7-39.8 9.9-8.7 5-18.6 12-18.7 21.9V78.1L61 74.5c-9.6-3-21.4-.8-26.9 5L3.2 112.2c-2.2 2.3-3.3 5-3.2 7.7V149c0 5.5 4.5 10.3 11.6 12.5l13.5 4.2c9.6 3 21.4.8 26.9-5l1.9-2 62.3 19.5c2.9.9 6 1.3 9 1.3 7.1 0 14-2.3 17.8-6.4l7.4-7.8c2-2.2 3.2-4.8 3.2-7.6V154c1.9.2 3.8.3 5.7.3 11.3 0 22.1-3.3 34-10.1 12.8-7.4 18.8-14.5 18.8-22.4v-2.3c3.3 1.3 7.1 1.9 10.9 1.9 4.2 0 8.4-.8 12-2.4l12.1-5.5c5.3-2.4 8.6-6.5 8.9-11v-.6zm-9.8-55.4v13.2c0 .3 0 .6-.1.9l-9.9-7.2c4-2.4 7.3-4.7 10-6.9zm-96.8-18.9 12-5.5c.1 0 .2-.1.2-.1.6-.3 1.2-.5 1.7-.8l11.3-4.7c28-10.9 44.1-10.3 61.4 2.3 7 5.1 10.4 9.4 10.1 12.8-.3 4.6-7.1 10.5-20.1 17.3-1.3.7-2.2 2.1-2.3 3.6-.1 1.5.6 3 1.8 3.9l20 14.7c1.1.8 1.8 1.7 1.7 2.4-.1.9-1.3 2.3-3.7 3.4l-12.1 5.5c-5.7 2.6-14.4 2.1-18.7-1.1l-65.2-47.9c-1.1-.8-1.8-1.7-1.7-2.4 0-.9 1.2-2.3 3.6-3.4zM95.5 59.1c15-8.6 28-11.2 44.1-7.1.4.2.8.3 1.2.3 9.7 2.7 20.5 7.7 33.5 15.2 19.5 11.3 29 19.7 29 25.9 0 4.2-4.7 9-14.4 14.5-10.3 5.9-19.6 9-29.7 9-13.7 0-28.7-5.7-49.1-17.4-19.5-11.3-29-19.7-29-25.9 0-4.1 4.7-8.9 14.4-14.5zM9.6 118.2l30.8-32.6c2.9-3 10.9-4.9 17.9-2.7l13.5 4.2c3.3 1 5.1 2.7 5.4 3.8.1.2.2.8-.8 1.9l-3.8 4c-1 1.1-1.4 2.7-1.1 4.1.4 1.5 1.5 2.6 2.9 3.1l64.9 20.3c3.3 1 5.1 2.7 5.4 3.8.1.2.2.8-.8 1.9l-7.4 7.8c-2.9 3-10.9 4.9-17.9 2.7l-64.9-20.3c-.4-.1-.9-.2-1.3-.2-1.2 0-2.3.5-3.2 1.4l-3.8 4c-2.9 3-10.9 4.9-17.9 2.7L14 123.9c-3.3-1-5.1-2.7-5.4-3.8.2-.2 0-.8 1-1.9zm233.9-12.9-12.1 5.5c-5.7 2.6-14.4 2.1-18.7-1.1l-2.1-1.6c-.8-.6-1.8-.9-2.7-.8h-.1c-2.4 0-4.4 2-4.4 4.4v9.9c0 4.3-4.9 9.4-14.4 14.8-13.9 8-25.5 10.4-38.8 8.1-.3 0-.5-.1-.8-.1h-.1c-2.4 0-4.3 2-4.3 4.4v8.6c0 .4-.2 1.1-.8 1.7l-7.4 7.8c-2.8 3-10.9 4.9-17.9 2.7L54 149.3c-1.6-.5-3.3 0-4.5 1.2l-3.8 4c-2.9 3-10.9 4.9-17.9 2.7L14.3 153c-4-1.2-5.5-3.2-5.5-4.1v-17.8c.9.4 1.9.8 2.9 1.1l13.5 4.2c9.6 3 21.4.8 26.9-5l1.9-2 62.3 19.5c2.9.9 6 1.3 9 1.3 7.1 0 14-2.3 17.8-6.4l7.4-7.8c2.8-3 3.8-6.6 2.9-10.1 0-.2-.1-.3-.2-.5h.4c2 .2 4 .3 5.9.3 11.2 0 21.9-3.2 33.9-10.2 8.7-5 18.8-12.1 18.8-22.1 0-.9-.1-1.8-.2-2.7 3.3 1.3 7.2 2 11.1 2 4.2 0 8.4-.8 12-2.4l12.1-5.5s.1 0 .1-.1v17c-.1 1-1.3 2.5-3.8 3.6z"></path>
        </svg>
    </div>

    <!-- THE RIGID GRID -->
    <div class="dashboard-container">
        <main class="dashboard-grid" data-active-tab="about">

            <!-- Top Left Cell (Choreography Demo) -->
            <section class="box box-area-a hover">
                <div class="stacked-content view-about">
                    <div class="hover_inner">
                        <video src="videos/SeattleMapAnim2.webm" autoplay loop muted></video>
                    </div>
                    <div class="video-overlay">
                        <h2 data-content="top-left-title" class="bento-heading-primary"></h2>
                        <p data-content="top-left-text"></p>
                    </div>
                </div>
                <div class="stacked-content view-portfolio">
                    <img data-content="wireframe-img" class="wireframe-img" src="" alt="Wireframe" style="display:none;" />
                </div>
                <div class="stacked-content view-arcade">
                    <h2 data-content="top-left-title" class="bento-heading-primary"></h2>
                    <p data-content="top-left-text"></p>
                </div>
                <div class="stacked-content view-contact">
                    <h2 data-content="top-left-title" class="bento-heading-primary"></h2>
                    <p data-content="top-left-text"></p>
                </div>
            </section>

            <!-- Navigation Zone (Top Right) -->
            <nav class="box box-area-b">
                <button class="tab-btn" data-tab="portfolio">PORTFOLIO</button>
                <button class="tab-btn is-active" data-tab="about">ABOUT</button>
                <button class="tab-btn" data-tab="arcade">ARCADE</button>
                <button class="tab-btn" data-tab="contact">CONTACT</button>
            </nav>

            <!-- Other grid areas for completeness -->
            <section class="box box-area-c">
                <div class="stacked-content view-about flex-start">
                    <p data-content="bio-label" class="bio-label"></p>
                    <p data-content="bio-text-1"></p>
                    <p data-content="bio-text-2"></p>
                    <h2 data-content="bio-title" class="bento-heading-secondary"></h2>
                    <p data-content="bio-text-3" class="text-block"></p>
                </div>
                <div class="stacked-content view-portfolio scrollable-content">
                    <h2 data-content="bio-title" class="bento-heading-secondary"></h2>
                    <p data-content="bio-text"></p>
                    <div id="portfolio-project-content" class="project-content-container" style="display: none;">
                        <p data-content="portfolio-project-desc-1"></p>
                        <p data-content="portfolio-project-desc-2"></p>
                    </div>
                </div>
                <div class="stacked-content view-arcade">
                    <h2 data-content="bio-title"></h2>
                    <p data-content="bio-text"></p>
                </div>
                <div class="stacked-content view-contact">
                    <textarea name="message" required form="top-contact-form" placeholder="Your Message..."></textarea>
                </div>
            </section>
            
            <section class="box box-area-d">
                <div class="bento-label">links</div>
                <div class="stacked-content view-about flex-center">
                    <p data-content="social-1" class="social-link-item"></p>
                    <p data-content="social-2" class="link-item"></p>
                </div>
                <div class="stacked-content view-portfolio flex-center">
                    <div id="portfolio-links-container" class="full-width">
                        <!-- Links will be injected here -->
                    </div>
                </div>
                <div class="stacked-content view-contact flex-center">
                    <input type="text" name="name" required form="top-contact-form" placeholder="Your Name">
                    <input type="email" name="email" required form="top-contact-form" placeholder="Your Email">
                </div>
            </section>

            <section class="box box-area-e">
                <div class="bento-label">projects</div>
                <div class="stacked-content view-about flex-center">
                    <h2 data-content="quote-text-html" class="handwriting-title"></h2>
                    <p class="quote-author-container"><span data-content="quote-author"></span><span data-content="quote-source" class="italic-source"></span></p>
                </div>
                <div class="stacked-content view-portfolio scrollable-list-content">
                    <ul id="project-list" class="project-list">
                        <!-- Projects will be generated here -->
                    </ul>
                </div>
                <div class="stacked-content view-arcade">
                    <h2 data-content="quote-title"></h2>
                    <p data-content="quote-text"></p>
                </div>
                <div class="stacked-content view-contact flex-center">
                    <div class="h-captcha" data-captcha="true"></div>
                    <button type="submit" id="contact-submit-btn" form="top-contact-form">SEND</button>
                </div>
            </section>
            
            <section class="box box-area-f">
                <div class="bento-label">PLATFORM</div>
                <div class="stacked-content view-about flex-center">
                    <p data-content="link-1" class="social-link-item"></p>
                    <p data-content="link-2" class="link-item"></p>
                </div>
                <div class="stacked-content view-portfolio flex-center scrollable-center-content">
                    <div id="portfolio-role-container" class="full-width">
                        <!-- Role will be injected here -->
                    </div>
                </div>
                <div class="stacked-content view-arcade flex-center scrollable-center-content">
                    <div id="arcade-platform-container" class="full-width">
                        <!-- Platform will be injected here -->
                    </div>
                </div>
            </section>
            
            <section class="box box-area-g">
                <div class="bento-label">WHY</div>
                <div class="stacked-content view-about flex-center">
                    <div class="flex-align-center-full">
                        <p data-content="soft-skills-text" class="text-block"></p>
                    </div>
                </div>
                <div class="stacked-content view-portfolio scrollable-center-content">
                    <div id="portfolio-what-i-did-container" class="full-width">
                        <!-- What I did will be injected here -->
                    </div>
                </div>
                <div class="stacked-content view-arcade scrollable-center-content">
                    <div id="arcade-why-container" class="full-width">
                        <!-- Why will be injected here -->
                    </div>
                </div>
            </section>
            
            <section class="box box-area-h">
                <div class="bento-label">tools i used</div>
                <div class="stacked-content view-about flex-center">
                    <p class="skill-item"><span data-content="hard-skills-text-1-label" class="skill-label"></span><span data-content="hard-skills-text-1"></span></p>
                    <p class="skill-item"><span data-content="hard-skills-text-2-label" class="skill-label"></span><span data-content="hard-skills-text-2"></span></p>
                    <p class="skill-item"><span data-content="hard-skills-text-3-label" class="skill-label"></span><span data-content="hard-skills-text-3"></span></p>
                    <p class="skill-item"><span data-content="hard-skills-text-4-label" class="skill-label"></span><span data-content="hard-skills-text-4"></span></p>
                </div>
                <div class="stacked-content view-portfolio scrollable-center-content">
                    <div id="portfolio-tools-container" class="full-width">
                        <!-- Tools I used will be injected here -->
                    </div>
                </div>
            </section>
            
<section class="box box-area-i">
                <div class="bento-label">did you know</div>
                <div class="stacked-content view-about flex-center">
                    <p data-content="didyouknow-text-1" class="text-margin-lg"></p>
                    <p data-content="didyouknow-text-2" class="text-block"></p>
                </div>
                <div class="stacked-content view-portfolio flex-center scrollable-center-content">
                    <div id="portfolio-did-you-know-container" class="full-width">
                        <!-- Did you know will be injected here -->
                    </div>
                </div>
            </section>
            
            <section class="box box-area-j">
                <div class="minimalist-footer">
                    <p>Hand-coded from scratch. If something is broken, just clear your cache.</p>
                    <p>© 2026 Tony Peterson — UX/UI Designer & Prototyper.</p>
                    <p class="status-line">> status: <span id="typewriter-text"></span><span class="cursor">|</span></p>
                </div>
            </section>

            <form id="top-contact-form" method="POST" action="https://api.web3forms.com/submit" style="display: none;">
                <input type="hidden" name="access_key" value="f1be3cc5-52d8-4c79-aa20-933d68fd90ed">
                <input type="hidden" name="subject" value="TOP Design Form Submitted">
                <input type="hidden" name="from_name" value="TOP Design Form">
                <input type="hidden" name="replyto" value="customer@example.com">
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
            </form>
        </main>
    </div>

    <!-- TIMELINE MODAL -->
    <div id="timeline-modal" class="timeline-modal-overlay">
        <span class="timeline-modal-close" id="timeline-close">&times;</span>
        <div class="timeline-content-wrapper">
            <h2>Career Timeline</h2>
            <div id="timeline-container">
                <div id="axis"></div>
                <div id="ticks-container"></div>
                <div id="nodes-container"></div>
            </div>
            <div id="detail-box">
                <span class="detail-close-btn" id="detail-close-btn">✕</span>
                <h3 id="detail-title">Company - Role</h3>
                <p id="detail-desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            </div>
        </div>
    </div>

    <!-- MEDIA MODAL -->
    <div id="image-modal" class="modal-overlay">
        <span class="modal-close">&times;</span>
        <img id="modal-image" src="" alt="Full size view" style="display: none;">
        <video id="modal-video" src="" controls autoplay style="display: none;"></video>
        <iframe id="modal-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display: none;"></iframe>
    </div>

    <!-- PROJECT MODAL -->
    <div id="project-tooltip" class="hover-tooltip"></div>

    <script src="https://web3forms.com/client/script.js" async defer></script>
    <script src="js/app.js"></script>
</body>
</html>
