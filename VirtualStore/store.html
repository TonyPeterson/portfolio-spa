<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Microsoft VR Store Demo</title>
    <meta name="description" content="Microsoft VR Store Demo">
    <meta name="ROBOTS" CONTENT="NOINDEX, NOFOLLOW, NOARCHIVE">

    <!-- MWF styles -->
    <link rel="stylesheet" type="text/css" href="https://assets.onestore.ms/cdnfiles/external/mwf/long/v1/v1.19.1/css/mwf-west-european-default.css">
    <!-- Custom styles -->
    <link rel="stylesheet" type="text/css" href="assets/styles/master.css">

    <script type="text/javascript" src="assets/js/bundle.js"></script>
</head>

<body>
    <!-- Light Box -->
    <div class="c-dialog f-flow" id="store-overlay" aria-hidden="false">
        <div role="presentation" tabindex="-1"></div>
        <div role="dialog" aria-label="Flow" tabindex="-1">
            <button class="c-glyph glyph-cancel" data-js-dialog-hide aria-label="Close dialog" tabindex="0"></button>
            <div role="document">
                <div data-grid="col-12" class="m-area-heading m-banner">
                    <a href="http://microsoft.com" class="c-logo">
                        <img class="c-image" src="assets/media/microsoft-logo-42x42.svg" alt="Microsoft Logo" itemscope itemtype="http://schema.org/ImageObject">
                        <span>Microsoft</span>
                    </a>
                    <h1 class="c-heading animate fadeInUp one">Welcome to Microsoft VR</h1>
                    <h3 class="c-subheading animate fadeIn three">Experience Microsoft products like never before</h3>
                </div>
                <section data-grid="container">
                    <div class="m-panes" data-grid="col-12">
                        <section>
                            <div class="m-panes-product-placement-item">
                                <picture class="c-image">
                                    <img class="animate fadeIn one" srcset="assets/media/cardboard-white-2.gif" src="assets/media/cardboard-white-2.gif" alt="Mobile VR headset">
                                </picture>
                                <div>
                                    <h3 class="c-heading-3 animate fadeIn one">Mobile Headset</h3>
                                    <p class="c-paragraph animate fadeIn two">(Recommended)</p>
                                    <div class="animate fadeIn three">
                                        <button class="c-call-to-action c-glyph" id="immersive-button">
                                            <span>ENTER VR STORE</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>
                        <section>
                            <div class="m-panes-product-placement-item">
                                <picture class="c-image">
                                    <img class="animate fadeIn four" srcset="assets/media/tethered-white.gif" src="assets/media/tethered-white.gif" alt="Mobile VR headset">
                                </picture>
                                <div>
                                    <h3 class="c-heading-3 animate fadeIn five">Tethered Headset</h3>
                                    <p class="c-paragraph animate fadeIn six">(Experimental)</p>
                                    <div class=" animate fadeIn seven">
                                        <button class="c-call-to-action c-glyph" aria-label="Learn more about using a tethered headset">
                                            <span>LEARN MORE</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>
                        <section>
                            <div class="m-panes-product-placement-item">
                                <picture class="c-image">
                                    <img class="animate fadeIn eight" srcset="assets/media/devices-white-2.gif" src="assets/media/devices-white-2.gif" alt="Mobile VR headset">
                                </picture>
                                <div>
                                    <h3 class="c-heading-3 animate fadeIn nine">No Headset</h3>
                                    <p class="c-paragraph animate fadeIn ten">(2D experience)</p>
                                    <div class="animate fadeIn eleven">
                                        <button class="c-call-to-action c-glyph" aria-label="Enter 2D store with no headset" id="no-headset-button">
                                            <span>ENTER 2D STORE</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <!-- End Lightbox -->

    <a-scene fog="type: linear; color: #a5d2fc; far: 30; near: 7">
        <a-assets inspector>
            <!-- Models -->
            <a-asset-item id="store-walls" src="assets/media/TransitionTest/WallsAndCeiling1.gltf"></a-asset-item>
            <a-asset-item id="store-floor" src="assets/media/TransitionTest/FloorAndTables3.gltf"></a-asset-item>

            <a-asset-item id="spotlight-obj" src="assets/media/TransitionTest/ProjectorLights1.gltf"></a-asset-item>
            <a-asset-item id="projector-obj" src="assets/media/TransitionTest/Projector2.gltf"></a-asset-item>

            <a-asset-item id="sliding-wall" src="assets/media/TransitionTest/SlidingWall1.gltf"></a-asset-item>
            <a-asset-item id="surface-pro-model" src="assets/media/surface-pro-holo/SurfaceProHolo.gltf"></a-asset-item>
            <a-asset-item id="office-table" src="assets/media/TransitionTest/OfficeTable2.gltf"></a-asset-item>
            <a-asset-item id="minecraft-scene" src="assets/media/TransitionTest/MinecraftScene2.gltf"></a-asset-item>

            <a-asset-item id="empty-store" src="assets/media/TransitionTest/WhiteRoomBox1.gltf"></a-asset-item>
            
            <a-asset-item id="ministore" src="assets/media/TransitionTest/MiniStore1.gltf"></a-asset-item>
            <a-asset-item id="maze" src="assets/media/TransitionTest/Maze1.gltf"></a-asset-item>
            
            <!-- TONYs DAEs --> 
            <a-asset-item id="mazerz" src="assets/media/TransitionTest/Maze1.dae"></a-asset-item>

            <!-- Images -->
            <img id="showroom-background" src="assets/media/studio_one.jpg">
            <img id="store-background" src="assets/media/minecraft-world.png">
            <img id="officevideo" src="assets/media/OfficeHolo2.gif">
            <img id="xboxvideo" src="assets/media/halo.gif">
            <img id="spotlight-img" src="assets/media/TransitionTest/spotlight.png">
            <img id="shun-placeholder" src="assets/media/office365/shun-placeholder.jpg">
            <img id="office-collaborate" src="assets/media/office365/office-collaborate.png">
            <img id="ios-icon" src="assets/media/office365/ios.png">
            <img id="android-icon" src="assets/media/office365/android.png">
            <img id="windows-icon" src="assets/media/office365/windows.png">
            <img id="studio-artist" src="assets/media/studio-artist.jpg">
            <img id="start-btn" src="assets/media/TransitionTest/Win98StartButton1.png">
            <img id="curved-surface-menu" src="assets/media/SurfaceCurvedMenuMock2.png">

            <!-- Office365 icons -->
            <img id="word-icon" src="assets/media/office365/word.png">
            <img id="excel-icon" src="assets/media/office365/excel.png">
            <img id="powerpoint-icon" src="assets/tevo@amail.clubmedia/office365/powerpoint.png">
            <img id="outlook-icon" src="assets/media/office365/outlook.png">
            <img id="onenote-icon" src="assets/media/office365/onenote.png">
            <img id="publisher-icon" src="assets/media/office365/publisher.png">
            <img id="access-icon" src="assets/media/office365/access.png">
            <img id="onedrive-icon" src="assets/media/office365/onedrive.png">
            <img id="skpye-icon" src="assets/media/office365/skype.png">
            <img id="msteams-icon" src="assets/media/office365/msteams.png">

            <!-- Fonts -->
            <a-mixin id="semiLightFont" text="font: assets/fonts/segoe-ui-semilight.fnt; fontImage: assets/fonts/segoe-ui-semilight.png"></a-mixin>
            <a-mixin id="semiLightFontGeo" text-geometry="font: assets/fonts/Segoe-UI-Semilight-Regular.json;"></a-mixin>

            <!-- Videos -->
            <video id="office-shun-video" src="assets/media/OfficeFullVideo1.mp4"></video>

            <!-- Mixins -->
            <a-mixin id="wall" 
                static-body 
                material="side:double; opacity: 0;" 
                geometry="primitive:box; width: 7.5; height: 1; depth: 0.5;"></a-mixin>

            <a-mixin id="checkpoint" 
                checkpoint 
                geometry="primitive:box; depth: 1.6; height: 0.01; width: 1;" 
                material="opacity: 0; color: #fff;" 
                animation="property: material.opacity; from: 0; to: 0.5; dur: 200; startEvents:mouseenter;" 
                animation__2="property: material.opacity; from: 0.5; to: 0; dur: 200; startEvents:mouseleave;"></a-mixin>

            <a-mixin id="staticBody" 
                static-body 
                geometry="primitive: box; depth: 1.6; height: 0.8; width: 1.2" 
                material="opacity:0;"></a-mixin>

            <a-mixin id="wallStaticBody" geometry="depth: 0.15; height:3; width: 12"></a-mixin>

            <a-mixin id="linkHoverAnimation" 
                animation="property: scale; from: 1 1 1; to: 1.1 1.1 1; dur: 200; startEvents:mouseenter;" 
                animation__2="property: scale; from: 1.1 1.1 1; to: 1 1 1; dur: 200; startEvents:mouseleave;"></a-mixin>
            
            <a-mixin id="linkHoverAnimationEnter" 
                attribute="scale" 
                dur="200" 
                to="1.1 1.1 1.1" 
                from="1 1 1" 
                begin="mouseenter"></a-mixin>

            <a-mixin id="linkHoverAnimationLeave" 
                attribute="scale" 
                dur="200" 
                to="1 1 1" 
                from="1.1 1.1 1.1" 
                begin="mouseleave"></a-mixin>

            <a-mixin id="menuButton" 
                text="color:#fff; align: center; width: 1.75;" 
                geometry="primitive:plane;height:0.25;width:0.85;" 
                material="color:#0078D7;"></a-mixin>

            <a-mixin id="panelMenuButton"
                text="color:#000; align: center; width:0.7; wrapCount:12;"
                geometry="primitive:plane; height:0.5; width:0.8;"
                material="color:#C8C8C8; opacity: 0.85;"></a-mixin>
            
            <a-mixin id="officeColor"
                material="color:#DA3B01;"></a-mixin>

            <a-mixin id="floortile" 
                checkpoint 
                geometry="primitive:box; depth: 1; height: 0.01; width: 1;" 
                material="opacity: 0;"></a-mixin>

            <a-mixin id="msLogoTile" 
                geometry="depth:0.025; height:0.3; width:0.3"></a-mixin>

            <a-mixin id="returnButton"
                text="value:Return to store; color:#000; wrapCount:14; align: center; side:double;" 
                geometry="primitive: plane; height: 0.1; width: 0.5;" 
                material="opacity: 0;" 
                position="-3.37 1.5 0" 
                rotation="0 90 0"></a-mixin>

            <!-- Templates -->
            <script type="text/html" id="modelAndMenu">
                <a-entity id="${id}" collada-model="${model}" position="${positionmodel}" rotation="${rotationmodel}"></a-entity>

                <a-entity rotation="${rotationmenu}" position="${positionmenu}" product-menu="target:#${id}">
                    <a-entity mixin="semiLightFont linkHoverAnimation" product-orbit-link id="${id}-orbit" text="value:Orbit; color:#fff; wrapCount:7; align: center; side:double;" geometry="primitive: plane; height: 0.1; width: 0.25;" material="opacity:0;" position="0 0 0"></a-entity>
                    <a-entity mixin="semiLightFont linkHoverAnimation" product-animate-link id="${id}-animate" text="value:Animate; color:#fff; wrapCount:7; align: center; side:double;" geometry="primitive: plane; height: 0.1; width: 0.25;" material="opacity:0;" position="0.275 0 0"></a-entity>
                </a-entity>
            </script>

            <script id="videoWall" type="text/html">
                <a-entity position="${position}">
                    <a-entity scale="2.55 1.48 0.09" geometry="" material="color:#282828"></a-entity>
                    <a-entity position="0 0 0.05" scale="0.15 0.15 0.01" geometry="primitive:plane;height:9;width:16" material="side:front;${video}"></a-entity>
                </a-entity>
            </script>

            <script id="floorTileRow" type="text/html">
                <a-entity layout="type: line;" rotation="0 90 0">
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                    <a-entity mixin="floortile"></a-entity>
                </a-entity>
            </script>

            <script id="officeIcon" type="text/html">
                <a-entity
                    id="${id}-border"
                    mixin="officeColor"
                    geometry="primitive: plane; width: 0.3; height: 0.3;"
                    position="0 0 -0.01"
                    scale="0 0 0">
                    <a-animation 
                        attribute="scale" 
                        from="0 0 0" 
                        to="1 1 1" 
                        dur="350"  
                        easing="ease" 
                        begin="enter"
                        end="leave"></a-animation>
                    <a-animation 
                        attribute="scale" 
                        to="0 0 0" 
                        from="1 1 1" 
                        dur="350"  
                        easing="ease" 
                        begin="leave"></a-animation>
                </a-entity>
                <a-image src="${src}"
                    width="0.25"
                    height="0.25"
                    event-proxy__enter="listen: mouseenter; target: #${id}-border; emit: enter;"
                    event-proxy__leave="listen: mouseleave; target: #${id}-border; emit: leave;"></a-image>
                <a-entity mixin="semiLightFont" 
                    text="value:${txt}; color:#000; align: center; width: 1.25;"
                    position="0 -0.2 0"></a-entity>
                <a-animation mixin="linkHoverAnimationEnter"></a-animation>
                <a-animation mixin="linkHoverAnimationLeave"></a-animation>
            </script>

            <script id="mobileIcon" type="text/html">
                <a-entity
                    id="${txt}-icon"
                    mixin="officeColor"
                    geometry="primitive: plane; width: 0.75; height: 0.75;"
                    scale="0 0 0">
                    <a-animation 
                        attribute="scale" 
                        from="0 0 0" 
                        to="1 1 1" 
                        dur="350"  
                        easing="ease" 
                        begin="enter"></a-animation>
                    <a-animation 
                        attribute="scale" 
                        to="0 0 0" 
                        from="1 1 1" 
                        dur="350"  
                        easing="ease" 
                        begin="leave"></a-animation>
                </a-entity>
                <a-image src="${src}"
                    width="0.5"
                    height="0.5"
                    position="0 0.075 0.05"
                    event-proxy__enter="listen: mouseenter; target: #${txt}-icon, #${txt}-icon-text; emit: enter;"
                    event-proxy__leave="listen: mouseleave; target: #${txt}-icon, #${txt}-icon-text; emit: leave;"></a-image>
                <a-entity id="${txt}-icon-text"
                    mixin="semiLightFont" 
                    text="value:${txt}; color:#000; align: center; width: 2.25;"
                    position="0 -0.25 0">
                    <a-animation 
                        attribute="text.color" 
                        from="#000" 
                        to="#fff" 
                        dur="350"  
                        easing="ease" 
                        begin="enter"></a-animation>
                    <a-animation 
                        attribute="text.color" 
                        to="#000" 
                        from="#fff" 
                        dur="350"  
                        easing="ease" 
                        begin="leave"></a-animation>
                </a-entity>
                <a-animation mixin="linkHoverAnimationEnter"></a-animation>
                <a-animation mixin="linkHoverAnimationLeave"></a-animation>
            </script>

            <script id="hotspot" type="text/html">
                <a-entity id="hotspot-${product}" 
                    position="${position}"
                    rotation="${rotation}"
                    geometry="primitive:torus; radius:0.03; radiusTubular:0.004;" 
                    material="side: double; color: #0078D7; opacity: 0.75;">
                    <a-animation 
                        attribute="scale" 
                        from="1 1 1" 
                        to="1.1 1.1 1.1" 
                        dur="500" 
                        repeat="indefinite" 
                        direction="alternate" 
                        easing="ease" 
                        begin="${product}enter" 
                        end="${product}leave"></a-animation>
                    <a-animation 
                        attribute="scale" 
                        to="1 1 1" 
                        dur="200" 
                        easing="ease" 
                        begin="${product}leave"></a-animation>
                </a-entity>
            </script>

            <!-- Surface Studio Models -->
            <a-asset-item id="studio-tower-base" src="assets/media/surface-studio/TowerBase.gltf"></a-asset-item>
            <a-asset-item id="studio-motherboard" src="assets/media/surface-studio/Motherboard.gltf"></a-asset-item>
            <a-asset-item id="studio-tower-cap" src="assets/media/surface-studio/TowerCap.gltf"></a-asset-item>
            <a-asset-item id="studio-l-arm" src="assets/media/surface-studio/L_Arm.gltf"></a-asset-item>
            <a-asset-item id="studio-r-arm" src="assets/media/surface-studio/R_Arm.gltf"></a-asset-item>
            <a-asset-item id="studio-lcd" src="assets/media/surface-studio/LCD.gltf"></a-asset-item>
            <a-asset-item id="studio-monitor-back" src="assets/media/surface-studio/MonitorBack.gltf"></a-asset-item>

            <a-asset-item id="studio-pen" src="assets/media/surface-studio/Pen.gltf"></a-asset-item>
            <a-asset-item id="studio-keyboard" src="assets/media/surface-studio/Keyboard.gltf"></a-asset-item>
            <a-asset-item id="studio-mouse" src="assets/media/surface-studio/Mouse.gltf"></a-asset-item>

            <a-asset-item id="studio-dial-cap" src="assets/media/surface-studio/DialCap.gltf"></a-asset-item>
            <a-asset-item id="studio-dial-base" src="assets/media/surface-studio/DialBase.gltf"></a-asset-item>
        </a-assets>

        <a-entity light="type: directional; color: #FFF; intensity: 0.3" position="0 1 1"></a-entity>

        <a-entity id="store-main" visible="true">
            <!-- Sky -->
            <a-sky src="#store-background"></a-sky>

            <!-- White store model -->
            <a-entity id="empty-store-drop" 
                gltf-model="#empty-store"
                position="0 0.005 0"
                visible="false"
                transition-element>
                <a-animation attribute="visible" 
                    begin="roomTransition" 
                    to="true"
                    delay="1000"></a-animation>
                <a-animation attribute="visible" 
                    begin="roomReturn" 
                    to="false"
                    delay="1000"></a-animation>
            </a-entity>

            <!-- Collision floor -->
            <a-entity id="collision-floor" 
                static-body 
                position="0 -0.28 0" 
                geometry="depth: 60; height: 0.5; width: 60" 
                material="opacity:0.9; color: #333;"></a-entity>
                
            <a-entity id="hidden-floor-1" 
                static-body 
                position="0 -4 0" 
                geometry="depth: 80; height: 0.5; width: 80" 
                material="opacity:1; color: #fff;"></a-entity>

            <!-- Collision tables -->
            <a-entity id="collision-tables"
                transition-element>
                <a-animation 
                    attribute="position" 
                    from="0 0 0" 
                    to="0 10 0" 
                    dur="1" 
                    easing="linear" 
                    begin="roomTransition"></a-animation>
                <a-animation 
                    attribute="position" 
                    from="0 10 0" 
                    to="0 0 0" 
                    dur="1" 
                    easing="linear" 
                    begin="roomReturn"></a-animation>

                <a-entity id="deals-collide" 
                    mixin="staticBody" 
                    position="0.04 0.38 4.12" 
                    geometry="depth:0.5; height: 0.9; width:0.55;"></a-entity>
                <a-entity id="surface-collide" 
                    mixin="staticBody" 
                    position="-3.01 0.4 1.99"></a-entity>
                <a-entity id="partner-collide" 
                    mixin="staticBody" 
                    position="3.02 0.4 1.99"></a-entity>
                <a-entity id="office-collide" 
                    mixin="staticBody"
                    position="2.7 0.42 -1" 
                    geometry="depth:1.19; 
                    width:0.5;"></a-entity>
                <a-entity id="xbox-collide" 
                    mixin="staticBody" 
                    position="-3 0.44 -1"></a-entity>
            </a-entity>

            <!-- Collision walls -->
            <!-- <a-entity id="sliding-wall-collide"
                    mixin="staticBody wallStaticBody"
                    position="0.01 1.25 -4.42"
                    geometry="width:2.6; depth:0.6;"></a-entity> -->
            <a-entity id="collide-wall-logo-l"
                mixin="staticBody wallStaticBody" 
                position="-3.33 1.26 -4.8" 
                geometry="width:4"></a-entity>
                <a-entity id="collide-wall-logo-r"
                mixin="staticBody wallStaticBody" 
                position="3.33 1.26 -4.8" 
                geometry="width:4"></a-entity>
            <a-entity id="collide-wall-n1"
                mixin="staticBody wallStaticBody" 
                position="3.65 1.26 -6"
                geometry="width:4.7"></a-entity>
            <a-entity id="collide-wall-n2"
                mixin="staticBody wallStaticBody" 
                position="-3.65 1.26 -6"
                geometry="width:4.7"></a-entity>
            <a-entity id="collide-wall-oppositedoor"
                mixin="staticBody wallStaticBody" 
                position="-1.22 1.26 -5.82"
                rotation="0 90 0"
                geometry="width:3.37"></a-entity>
            <a-entity id="collide-wall-nexttodoor"
                mixin="staticBody wallStaticBody" 
                position="1.346 1.26 -5.08"
                rotation="0 90 0"
                geometry="width:1.87"></a-entity>
            <a-entity id="collide-wall-s"
                mixin="staticBody wallStaticBody" 
                position="0 1.26 6.1"></a-entity>
            <a-entity id="collide-wall-e"
                mixin="staticBody wallStaticBody" 
                position="6 1.26 0" 
                rotation="0 90 0"></a-entity>
            <a-entity id="collide-wall-w"
                mixin="staticBody wallStaticBody" 
                position="-6 1.26 0" 
                rotation="0 90 0"></a-entity>

            <!-- Store walls and ceiling -->
            <a-entity transition-element 
                position="0 0 0">
                <a-animation 
                    attribute="position" 
                    from="0 0 0" 
                    to="0 10 0" 
                    dur="1000" 
                    easing="linear" 
                    begin="roomTransition"></a-animation>
                <a-animation 
                    attribute="position" 
                    to="0 0 0" 
                    from="0 10 0" 
                    dur="1000" 
                    easing="linear" 
                    begin="roomReturn"></a-animation>

                <!-- Store walls and ceiling model -->
                <a-entity id="store-wall-drop" gltf-model="#store-walls"></a-entity>

                <!-- Glass Wall -->
                <a-entity id="glasswall" 
                    transition-element 
                    position="0 1.4 6" 
                    scale="12 3 0.01" 
                    material="opacity:0.333; metalness:0.333; roughness:0.333; color:#ddd; sphericalEnvMap:https://img.gs/bbdkhfbzkk/2048x1024,stretch/http://i.imgur.com/WMNH2OF.jpg" 
                    geometry="mergeTo:null"></a-entity>

                <!-- Sliding menu -->
                <a-entity id="sliding-menu">
                    <a-entity id="sliding-wall-drop" gltf-model="#sliding-wall"></a-entity>
                    <a-entity id="sliding-wall-collide" 
                        mixin="staticBody wallStaticBody" 
                        position="0.01 1.25 -4.23" 
                        geometry="width:2.6; depth:0.2;"></a-entity>
                    <a-animation 
                        attribute="position" 
                        from="0 0 0" 
                        to="0 0 -1.8" 
                        dur="2000" 
                        easing="ease-quart" 
                        begin="startClicked"></a-animation>
                    <a-animation 
                        attribute="position" 
                        to="0 0 0" 
                        dur="2000" 
                        easing="ease-quart" 
                        begin="closeClicked"></a-animation>
                    <a-animation 
                        attribute="position" 
                        to="0 0 -3.3" 
                        dur="2000" 
                        easing="ease-quart" 
                        begin="push2"></a-animation>

                    <!-- MS Wall -->
                    <a-entity position="0 0 -4.1">
                        <a-entity mixin="semiLightFont" 
                            text="value:Hello Benson; color:#000; align: center; width: 3;" 
                            position="0 2.44 0"></a-entity>

                        <a-entity id="ms-logo" position="-0.1625 2 0">
                            <a-entity id="ms-logo-red" 
                                mixin="msLogoTile" 
                                material="color:#F35325;"></a-entity>
                            <a-entity id="ms-logo-green" 
                                mixin="msLogoTile" 
                                position="0.325 0 0" 
                                material="color:#81BC06;"></a-entity>
                            <a-entity id="ms-logo-blue" 
                                mixin="msLogoTile" 
                                position="0 -0.325 0" 
                                material="color:#05A6F0;"></a-entity>

                material="color: #ccc; shader: flat;" 
                raycaster></a-entity>

            <!-- Hands -->
            <!-- <a-entity hand-controls="left"></a-entity>
                <a-entity hand-controls="right"></a-entity> -->
        </a-entity>

        <a-entity id="camera-orbit" camera="active: false" distance="1"></a-entity>

        <!-- Lights -->
        <a-light id="ambient-light" type="ambient" intensity="1"></a-light>

    </a-scene>

    <script type="text/javascript">
        (function() {
            var immersive = document.getElementById('immersive-button'),
                noHeadset = document.getElementById('no-headset-button'),
                overlay = document.getElementById('store-overlay'),
                scene = document.querySelector('a-scene');

            immersive.addEventListener('click', function() {
                overlay.setAttribute('aria-hidden', true);
                document.getElementsByClassName('a-enter-vr')[0].style.display = 'block';
                if (scene.hasLoaded) {
                    scene.enterVR();
                } else {
                    scene.addEventListener('loaded', function() {
                        scene.enterVR();
                    });
                }
            });

            noHeadset.addEventListener('click', function() {
                overlay.setAttribute('aria-hidden', true);
                document.getElementsByClassName('a-enter-vr')[0].style.display = 'block';
            });
        })();
    </script>
</body>

</html>
